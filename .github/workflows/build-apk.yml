name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Retrora APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android \
            -keypass android

      - name: Install Godot 4.7.2 Headless & Export Templates
        run: |
          GODOT_VERSION="4.7.2-stable"
          
          echo "Downloading Godot ${GODOT_VERSION} Linux binary..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Downloading Godot ${GODOT_VERSION} export templates..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/* "$TEMPLATE_DIR/"

          echo "Configuring Godot Editor Settings for Android SDK..."
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$CONFIG_DIR"
          cat <<EOF > "$CONFIG_DIR/editor_settings-4.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Retrora APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/Retrora.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Retrora-APK
          path: build/Retrora.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "RETRORA Arcade v1.0.0"
          body: |
            ## 🎮 RETRORA Arcade v1.0.0 (Official Android Release)
            
            Download and install **Retrora.apk** directly on your Android phone!
            
            ### Included Features:
            - **Custom App Icon**: Retro gamepad "R" launcher icon.
            - **7 Offline Classic Arcade Games**:
              1. 🐍 **Snake** (Grid Arcade)
              2. 🏎️ **Retro Racer** (3-Lane Highway)
              3. 🕊️ **Sky Hopper** (One-Button Flying)
              4. ⚪ **Bounce Quest** (Retro Platformer)
              5. 🚀 **Space Defender** (Vertical SHMUP & Boss)
              6. 🧱 **Brick Breaker** (Paddle & Ball Physics)
              7. 🐹 **Hamster Game** (Smart Watch Whack-a-Hamster)
            - **Central High Scores Leaderboard**
            - **Settings Menu**: SFX, Music, Screen Shake, Vibration
            - **CRT Scanline Shader Overlay**
            - **Unified In-Game Pause Menu**
          files: build/Retrora.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
