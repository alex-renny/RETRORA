name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build and Release Retrora APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Android Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android \
            -keypass android

      - name: Install Godot 4.7.2 Headless & Export Templates
        run: |
          GODOT_VERSION="4.7.2-stable"
          
          echo "Downloading Godot ${GODOT_VERSION} Linux binary..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Downloading Godot ${GODOT_VERSION} export templates..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -r templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable.official"
          cp -r templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable.official/"

          echo "Configuring Godot Editor Settings for Android SDK..."
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$CONFIG_DIR"
          cat <<EOF > "$CONFIG_DIR/editor_settings-4.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Export Retrora APK
        run: |
          echo "Pre-importing assets with ETC2/ASTC compression..."
          godot --headless --editor --quit || true
          mkdir -p build
          echo "Exporting Android APK..."
          godot --headless --export-debug "Android" build/Retrora.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Retrora-APK
          path: build/Retrora.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "RETRORA Arcade v1.3.0 - Forbidden Treasures, Block Fill & Neon UI"
          make_latest: true
          body: |
            ## 🎮 RETRORA Arcade v1.3.0

            Download and install **Retrora.apk** directly on your Android phone!

            ### What's New in v1.3.0:
            - **New Game: Forbidden Treasures** 🗺️
              - Nokia-classic underground mining game with realistic cobblestone cave textures.
              - Snow-capped mountain sky backdrop at the surface.
              - 3 Biomes: Lost Jungle (Earth), Glacial Tundra (Snow), Molten Abyss (Volcano).
              - Realistic animated miner character with yellow hard hat, blue overalls, and pickaxe swing.
              - Falling boulder physics, TNT explosions, H2O stamina gauge, diamond clusters, gold veins.
              - Patrolling enemies: Jackals, Frost Wolves, Fire Drakes.
              - Beveled brass/wood triangular arrow buttons + large pickaxe action button.
              - 4 Outfits & 4 Pickaxes to unlock as you progress.
            - **New Game: Block Fill** 🔷
              - Classic one-stroke neon puzzle: fill every block with a continuous glowing line!
              - 10 hand-crafted progressive levels (4×4 up to 7×7), plus procedural endless levels (8×8).
              - Fluid touch drag with swipe interpolation — no missed cells during fast swipes.
              - Undo step + Reset button. Drag backward to retrace your path.
              - 5 Unlockable Neon Palettes & 4 Trail Spark styles.
            - **Light/Dark Theme Toggle** for all games and menus.
            - **Realistic Character Animations** across all games.
          files: build/Retrora.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
