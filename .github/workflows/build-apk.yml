name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build and Release Retrora APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Android Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android \
            -keypass android

      - name: Install Godot 4.7.2 Headless & Export Templates
        run: |
          GODOT_VERSION="4.7.2-stable"
          
          echo "Downloading Godot ${GODOT_VERSION} Linux binary..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Downloading Godot ${GODOT_VERSION} export templates..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -r templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable.official"
          cp -r templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable.official/"

          echo "Configuring Godot Editor Settings for Android SDK..."
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$CONFIG_DIR"
          cat <<EOF > "$CONFIG_DIR/editor_settings-4.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Export Retrora APK
        run: |
          echo "Pre-importing assets with ETC2/ASTC compression..."
          godot --headless --editor --quit || true
          mkdir -p build
          echo "Exporting Android APK..."
          godot --headless --export-debug "Android" build/Retrora.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Retrora-APK
          path: build/Retrora.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "RETRORA Arcade v1.2.0 - Visual Showcase & Padlock Criteria Update"
          make_latest: true
          body: |
            ## 🎮 RETRORA Arcade v1.2.0 (Visual Item Showcase & Unlocks Update)
            
            Download and install **Retrora.apk** directly on your Android phone!
            
            ### What's New in v1.2.0:
            - **Visual Item Previews**:
              - All skins, vehicles, roads, animals, birds, balls, paddles, and grounds now display dedicated 50x50 vector art previews.
            - **Lock & Criteria Showcase**:
              - Locked items are visually displayed in a shaded theme with a golden padlock `🔒` badge.
              - Exact unlock requirements ("CRITERIA: Reach Score 35", "CRITERIA: Reach 700m", "CRITERIA: Whack 50 Animals", etc.) are prominently badge-styled.
            - **Quick Unlocks Access in Menus**:
              - Added `[ 🎨 ]` Unlocks buttons directly next to every game in the Game Select menu.
              - Added `[ 🎨 ]` Unlocks buttons directly inside every game's Game Over screen.
            - **Bounce Quest Grounds**:
              - Conquering levels in Bounce Quest unlocks new grounds and obstacle courses directly selectable from the customizer.
          files: build/Retrora.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
